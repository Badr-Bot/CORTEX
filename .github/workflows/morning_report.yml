name: CORTEX — Rapport du matin

on:
  schedule:
    # RÉALITÉ : c'est GitHub Actions qui génère le rapport (l'app serveur
    # Fly/Railway n'est pas allumée). Les crons GitHub gratuits partent en
    # retard (best-effort, observé +3 à +6h). On vise donc TÔT (03:00 UTC)
    # pour que la livraison réelle tombe le matin.
    # NB heure d'été : Paris = UTC+2 en été, UTC+1 en hiver.
    # Livraison à 6h PILE = impossible à garantir ici → nécessite l'app
    # serveur allumée (APScheduler, timezone Europe/Paris).
    - cron: '0 3 * * *'
  workflow_dispatch:       # Déclenchement manuel possible

jobs:
  run:
    runs-on: ubuntu-latest
    # 5 secteurs à analyser (dont e-commerce) : ~6-8 min en pratique
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le rapport du matin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -c "import asyncio; from morning_report import run_morning_report; asyncio.run(run_morning_report(hours=24, send_telegram=True))"
