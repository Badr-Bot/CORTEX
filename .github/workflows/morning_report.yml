name: CORTEX — Rapport du matin

on:
  schedule:
    # FILET DE SECOURS. Le rapport normal est rédigé par l'agent Claude
    # planifié (mode cowork, 03:00 UTC) et publié par cowork_publish.yml.
    # Ce pipeline gratuit (Groq/Gemini) ne tourne que si aucun rapport complet
    # n'existe encore en base pour aujourd'hui — il s'arrête sinon.
    # 06:00 UTC = 08:00 Paris ; les crons GitHub gratuits partent souvent
    # avec 3 à 6 h de retard, ce qui laisse à la routine le temps de livrer.
    - cron: '0 6 * * *'
  workflow_dispatch:       # Déclenchement manuel possible

jobs:
  run:
    runs-on: ubuntu-latest
    # 5 secteurs à analyser (dont e-commerce) : ~6-8 min en pratique
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le rapport du matin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -c "import asyncio; from morning_report import run_morning_report; asyncio.run(run_morning_report(hours=24, send_telegram=True))"
